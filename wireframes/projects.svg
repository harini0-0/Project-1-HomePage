<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2240" font-family="Courier New, monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: none; stroke: #333; stroke-width: 1.5; }
      .box-light { fill: none; stroke: #999; stroke-width: 1; }
      .line { stroke: #999; stroke-width: 2; }
      .line-thin { stroke: #bbb; stroke-width: 1.5; }
      .cross { stroke: #999; stroke-width: 1; }
      .text { fill: #333; font-size: 11px; }
      .label { fill: #666; font-size: 10px; }
      .tiny { fill: #999; font-size: 9px; }
      .annot { fill: #888; font-size: 9px; font-style: italic; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="2240"/>

  <!-- Title -->
  <text x="40" y="28" class="text" font-size="13" font-weight="700">WIREFRAME / projects.html / PROJECTS PAGE</text>
  <line x1="40" y1="38" x2="960" y2="38" class="line-thin"/>

  <!-- ===== NAVBAR ===== -->
  <g transform="translate(40, 60)">
    <rect class="box" width="920" height="50"/>
    <circle cx="28" cy="25" r="14" class="box"/>
    <line x1="20" y1="17" x2="36" y2="33" class="cross"/>
    <line x1="36" y1="17" x2="20" y2="33" class="cross"/>
    <line x1="55" y1="25" x2="180" y2="25" class="line"/>
    <line x1="640" y1="25" x2="690" y2="25" class="line"/>
    <line x1="710" y1="25" x2="780" y2="25" class="line" stroke="#333" stroke-width="3"/>
    <line x1="800" y1="25" x2="850" y2="25" class="line"/>
    <line x1="870" y1="25" x2="900" y2="25" class="line"/>
    <text x="0" y="-6" class="annot">[navigation, sticky, "Projects" active]</text>
  </g>

  <!-- ===== HEADER ===== -->
  <g transform="translate(40, 130)">
    <rect class="box" width="920" height="140"/>
    <text x="0" y="-6" class="annot">[page header]</text>
    <line x1="30" y1="30" x2="120" y2="30" class="line"/>
    <text x="135" y="34" class="tiny">// section eyebrow</text>
    <line x1="30" y1="70" x2="380" y2="70" stroke="#333" stroke-width="8"/>
    <text x="395" y="74" class="annot">H1 heading</text>
    <line x1="30" y1="110" x2="400" y2="110" class="line-thin"/>
    <text x="415" y="114" class="annot">1-line intro</text>
  </g>

  <!-- ===== HONEYCOMB ===== -->
  <g transform="translate(40, 300)">
    <rect class="box" width="920" height="380"/>
    <text x="0" y="-6" class="annot">[honeycomb / 4 featured projects, hex shape, click = anchor scroll]</text>

    <!-- 4 hex outlines, alternating offset -->
    <!-- Hex 1 (top-left) -->
    <g transform="translate(160, 60)">
      <polygon points="100,0 200,50 200,150 100,200 0,150 0,50" class="box"/>
      <line x1="0" y1="0" x2="200" y2="200" class="cross"/>
      <line x1="200" y1="0" x2="0" y2="200" class="cross"/>
    </g>
    <!-- Hex 2 (top-right) -->
    <g transform="translate(560, 60)">
      <polygon points="100,0 200,50 200,150 100,200 0,150 0,50" class="box"/>
      <line x1="0" y1="0" x2="200" y2="200" class="cross"/>
      <line x1="200" y1="0" x2="0" y2="200" class="cross"/>
    </g>
    <!-- Hex 3 (bottom-left, offset down) -->
    <g transform="translate(360, 160)">
      <polygon points="100,0 200,50 200,150 100,200 0,150 0,50" class="box"/>
      <line x1="0" y1="0" x2="200" y2="200" class="cross"/>
      <line x1="200" y1="0" x2="0" y2="200" class="cross"/>
    </g>
    <!-- Hex 4 (bottom-right, offset down) -->
    <g transform="translate(760, 160)">
      <polygon points="100,0 200,50 200,150 100,200 0,150 0,50" class="box"/>
      <line x1="0" y1="0" x2="200" y2="200" class="cross"/>
      <line x1="200" y1="0" x2="0" y2="200" class="cross"/>
    </g>
    <text x="460" y="365" text-anchor="middle" class="annot">4 hex tiles, 2-on-top + 2-offset-down, alternating</text>
  </g>

