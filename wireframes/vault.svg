<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1980" font-family="Courier New, monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: none; stroke: #333; stroke-width: 1.5; }
      .box-hidden { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .key-box { fill: none; stroke: #333; stroke-width: 1.5; }
      .line { stroke: #999; stroke-width: 2; }
      .line-thin { stroke: #bbb; stroke-width: 1.5; }
      .cross { stroke: #999; stroke-width: 1; }
      .text { fill: #333; font-size: 11px; }
      .label { fill: #666; font-size: 10px; }
      .tiny { fill: #999; font-size: 9px; }
      .annot { fill: #888; font-size: 9px; font-style: italic; }
      .key-glyph { fill: #333; font-size: 18px; font-weight: 700; font-family: monospace; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="1980"/>

  <!-- Title -->
  <text x="40" y="28" class="text" font-size="13" font-weight="700">WIREFRAME / ai.html / THE VAULT</text>
  <line x1="40" y1="38" x2="960" y2="38" class="line-thin"/>

  <!-- ===== NAVBAR ===== -->
  <g transform="translate(40, 60)">
    <rect class="box" width="920" height="50"/>
    <circle cx="28" cy="25" r="14" class="box"/>
    <line x1="20" y1="17" x2="36" y2="33" class="cross"/>
    <line x1="36" y1="17" x2="20" y2="33" class="cross"/>
    <line x1="55" y1="25" x2="180" y2="25" class="line"/>
    <line x1="640" y1="25" x2="690" y2="25" class="line"/>
    <line x1="710" y1="25" x2="780" y2="25" class="line"/>
    <line x1="800" y1="25" x2="870" y2="25" class="line" stroke="#333" stroke-width="3"/>
    <line x1="890" y1="25" x2="920" y2="25" class="line"/>
    <text x="0" y="-6" class="annot">[navigation, sticky, "The Vault" active]</text>
  </g>

  <!-- ===== VAULT HERO (locked state, visible by default) ===== -->
  <g transform="translate(40, 140)">
    <rect class="box" width="920" height="540"/>
    <text x="0" y="-6" class="annot">[vault / locked state, visible by default]</text>

    <!-- eyebrow -->
    <text x="460" y="60" text-anchor="middle" class="tiny">// secret room</text>

    <!-- BIG mono heading -->
    <line x1="200" y1="110" x2="720" y2="110" stroke="#333" stroke-width="12"/>
    <line x1="240" y1="140" x2="680" y2="140" stroke="#333" stroke-width="12"/>
    <text x="460" y="170" text-anchor="middle" class="annot">H1 (mono, uppercase)</text>

    <!-- tagline -->
    <line x1="280" y1="210" x2="640" y2="210" class="line-thin"/>
    <text x="460" y="230" text-anchor="middle" class="annot">tagline (1 line)</text>

    <!-- 10 KEY BOXES -->
    <g transform="translate(150, 270)">
      <!-- 10 keyboard keys in a row, with arrow / letter glyphs -->
      <g transform="translate(0, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8593;</text></g>
      <g transform="translate(66, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8593;</text></g>
      <g transform="translate(132, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8595;</text></g>
      <g transform="translate(198, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8595;</text></g>
      <g transform="translate(264, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8592;</text></g>
      <g transform="translate(330, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8594;</text></g>
      <g transform="translate(396, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8592;</text></g>
      <g transform="translate(462, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">&#8594;</text></g>
      <g transform="translate(528, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">B</text></g>
      <g transform="translate(594, 0)"><rect class="key-box" width="56" height="56" rx="6"/>
        <text x="28" y="36" text-anchor="middle" class="key-glyph">A</text></g>
    </g>
    <text x="460" y="360" text-anchor="middle" class="annot">10 keyboard keys, styled as 3D keycaps</text>

    <!-- pulsing status dot -->
    <circle cx="430" cy="425" r="6" fill="#333"/>
    <line x1="445" y1="425" x2="540" y2="425" class="line"/>
    <text x="460" y="465" text-anchor="middle" class="annot">"awaiting input" indicator (pulsing dot + label)</text>
  </g>

  <!-- ===== TIMELINE (revealed by Konami, dashed border to indicate hidden state) ===== -->
  <g transform="translate(40, 730)">
    <rect class="box-hidden" width="920" height="940"/>
    <text x="0" y="-6" class="annot" fill="#888">[timeline / revealed only after Konami code is entered]</text>

    <!-- eyebrow + heading -->
    <line x1="60" y1="35" x2="200" y2="35" class="line"/>
    <text x="210" y="39" class="tiny">// timeline unlocked</text>
    <line x1="60" y1="75" x2="280" y2="75" stroke="#333" stroke-width="8"/>
    <text x="295" y="79" class="annot">H2 heading</text>

    <!-- Vertical dotted timeline with 6 items -->
    <line x1="200" y1="125" x2="200" y2="855" stroke="#999" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- Each timeline item: year on left, content on right, dot on the line -->
    <g transform="translate(60, 130)">
      <text x="120" y="22" text-anchor="end" class="annot" font-size="11">[year]</text>
      <line x1="0" y1="20" x2="120" y2="20" stroke="#333" stroke-width="6"/>
      <circle cx="140" cy="20" r="6" fill="#333"/>
      <line x1="170" y1="14" x2="650" y2="14" stroke="#333" stroke-width="5"/>
      <line x1="170" y1="38" x2="780" y2="38" class="line-thin"/>
      <line x1="170" y1="55" x2="700" y2="55" class="line-thin"/>
      <line x1="170" y1="72" x2="600" y2="72" class="line-thin"/>
    </g>

    <g transform="translate(60, 260)">
      <line x1="0" y1="20" x2="120" y2="20" stroke="#333" stroke-width="6"/>
      <circle cx="140" cy="20" r="6" fill="#333"/>
      <line x1="170" y1="14" x2="550" y2="14" stroke="#333" stroke-width="5"/>
      <line x1="170" y1="38" x2="780" y2="38" class="line-thin"/>
      <line x1="170" y1="55" x2="720" y2="55" class="line-thin"/>
    </g>

    <g transform="translate(60, 380)">
      <line x1="0" y1="20" x2="120" y2="20" stroke="#333" stroke-width="6"/>
      <circle cx="140" cy="20" r="6" fill="#333"/>
      <line x1="170" y1="14" x2="500" y2="14" stroke="#333" stroke-width="5"/>
      <line x1="170" y1="38" x2="770" y2="38" class="line-thin"/>
      <line x1="170" y1="55" x2="700" y2="55" class="line-thin"/>
    </g>

    <g transform="translate(60, 500)">
      <line x1="0" y1="20" x2="120" y2="20" stroke="#333" stroke-width="6"/>
      <circle cx="140" cy="20" r="6" fill="#333"/>
      <line x1="170" y1="14" x2="580" y2="14" stroke="#333" stroke-width="5"/>
      <line x1="170" y1="38" x2="790" y2="38" class="line-thin"/>
      <line x1="170" y1="55" x2="730" y2="55" class="line-thin"/>
      <line x1="170" y1="72" x2="640" y2="72" class="line-thin"/>
    </g>

    <g transform="translate(60, 630)">
      <line x1="0" y1="20" x2="120" y2="20" stroke="#333" stroke-width="6"/>
      <circle cx="140" cy="20" r="6" fill="#333"/>
      <line x1="170" y1="14" x2="600" y2="14" stroke="#333" stroke-width="5"/>
      <line x1="170" y1="38" x2="770" y2="38" class="line-thin"/>
      <line x1="170" y1="55" x2="700" y2="55" class="line-thin"/>
    </g>

    <g transform="translate(60, 750)">
      <line x1="0" y1="20" x2="120" y2="20" stroke="#333" stroke-width="6"/>
      <circle cx="140" cy="20" r="6" fill="#333"/>
      <line x1="170" y1="14" x2="460" y2="14" stroke="#333" stroke-width="5"/>
      <line x1="170" y1="38" x2="500" y2="38" class="line-thin"/>
    </g>

    <!-- CTA -->
    <text x="460" y="900" text-anchor="middle" class="annot">CTA: "Want to be the next milestone? Contact."</text>
    <line x1="350" y1="918" x2="570" y2="918" class="line-thin"/>
  </g>

  <!-- ===== AI DISCLOSURE (small section at the bottom) ===== -->
  <g transform="translate(40, 1700)">
    <rect class="box" width="920" height="200"/>
    <text x="0" y="-6" class="annot">[AI disclosure / small honest section]</text>

    <line x1="30" y1="35" x2="150" y2="35" class="line"/>
    <text x="160" y="39" class="tiny">// about this page</text>
    <line x1="30" y1="70" x2="240" y2="70" stroke="#333" stroke-width="7"/>

    <line x1="30" y1="100" x2="850" y2="100" class="line-thin"/>
    <line x1="30" y1="118" x2="800" y2="118" class="line-thin"/>
    <line x1="30" y1="136" x2="650" y2="136" class="line-thin"/>

    <rect x="30" y="155" width="220" height="28" rx="4" class="box"/>
    <text x="140" y="173" text-anchor="middle" class="tiny">&#9656; Show verbatim prompt</text>
    <text x="270" y="173" class="annot">collapsible &lt;details&gt; element</text>
  </g>

  <!-- ===== FOOTER ===== -->
  <g transform="translate(40, 1920)">
    <rect class="box" width="920" height="40"/>
    <line x1="30" y1="20" x2="240" y2="20" class="line-thin"/>
    <line x1="650" y1="20" x2="900" y2="20" class="line-thin"/>
  </g>
</svg>
